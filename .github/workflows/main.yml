name: Main

# Runs on dev and main, and on pull requests, so every gate below applies before
# code reaches main — not just after. `deploy` still only fires on a push to
# main (guarded explicitly on the job, since workflow_dispatch has no implicit
# branch restriction).
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      force_desktop:
        description: Build the desktop apps even if flutter_app did not change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Was a single hardcoded "main" group, which only worked because main was the
  # only trigger. With dev and pull_request added, two unrelated runs (e.g. a
  # dev push and a PR) would now share one group and cancel each other.
  # Scoping by ref keeps them independent.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.5"
  # Matches the base image pinned in app/Dockerfile — see docs/deploy/pinning.md.
  NODE_VERSION: "22.23.1"
  SERVER_BUILDS_PATH: ${{ vars.DESKTOP_BUILDS_PATH || '/opt/watch-party/builds/desktop' }}

jobs:
  # ── Gates ──────────────────────────────────────────────────────────────
  # Every `uses:` below is pinned to a full commit SHA, with the human-readable
  # tag in a trailing comment — a floating tag (@v4, @v2) can change what code
  # runs in this workflow without a corresponding commit here. To bump a pin,
  # resolve the new tag's commit and update both the SHA and the comment.

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Scans the commits in this push (or the PR diff) — not full history.
      # Rewriting history to purge the historical LiveKit dev-default placeholder
      # was explicitly declined (docs/security/livekit-credential-exposure.md);
      # this stops a NEW secret from ever landing, which is the actual goal.
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - working-directory: app
        run: npm ci

      - working-directory: app
        run: npm test

      # --audit-level=high fails the step on high/critical, matching the "no
      # high vulnerabilities" acceptance criterion, without blocking on the
      # low body-parser advisory tracked separately in the spec.
      - working-directory: app
        run: npm audit --omit=dev --audit-level=high

  client-checks:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - working-directory: app/client
        run: npm ci

      - working-directory: app/client
        run: npm run typecheck

      - working-directory: app/client
        run: npm test

      - working-directory: app/client
        run: npm run build

      - working-directory: app/client
        run: npm audit --audit-level=high

  flutter-checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - working-directory: flutter_app
        run: flutter pub get

      - working-directory: flutter_app
        run: flutter analyze

      - working-directory: flutter_app
        run: flutter test

  # The desktop apps only need rebuilding when the Flutter sources (or this
  # workflow) change — a server-only push must not spend three runners on them.
  changes:
    name: Detect desktop changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.force_desktop }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ] || [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "Forced desktop build."
            exit 0
          fi
          # First push to the branch, or history rewritten — no usable base.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit — building desktop."
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          echo "Changed files:"; echo "$changed"
          if grep -qE '^(flutter_app/|\.github/workflows/main\.yml$)' <<<"$changed"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "No Flutter changes — skipping desktop builds."
          fi

  deploy:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: [secret-scan, server-tests, client-checks, flutter-checks]
    # Explicit, not just inherited from the trigger filter: workflow_dispatch has
    # no implicit branch restriction, and the trigger above now also fires on
    # dev and on pull_request, neither of which should ever deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy and verify health
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          # One SSH session for pull, bring-up, and health check: the health
          # check's rollback message needs ORIG_HEAD from the same `git pull`
          # that just ran, and `set -e` means the step (and this job) goes red
          # the moment any command — including health-check.sh — exits nonzero.
          # There is deliberately no automated rollback here: see
          # docs/deploy/rollback.md for why recovery stays a documented, manual
          # step rather than a scripted one.
          script: |
            set -e
            cd /opt/watch-party
            git pull --ff-only origin main

            if [ ! -f secrets/.env ] || [ ! -f secrets/.env.local ]; then
              echo "secrets/.env or secrets/.env.local is missing on the VPS"
              exit 1
            fi

            sudo ./deploy/firewall.sh --verify

            docker compose --env-file secrets/.env -f docker-compose.prod.yml pull
            docker compose --env-file secrets/.env -f docker-compose.prod.yml up -d --build

            ./deploy/health-check.sh

  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        working-directory: flutter_app
        shell: bash
        run: |
          base="$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          echo "value=${base}-main.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: flutter_app
        shell: bash
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-number="$GITHUB_RUN_NUMBER"

      - name: Package DMG
        working-directory: flutter_app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path" || { echo "No macOS app was produced"; exit 1; }
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app_path"
          mkdir -p dmg-stage dist
          cp -R "$app_path" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname Watchparty -srcfolder dmg-stage -ov -format UDZO \
            "dist/Watchparty-${VERSION}-macos.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchparty-macos
          path: flutter_app/dist/*.dmg
          if-no-files-found: error

  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl libayatana-appindicator3-dev libgtk-3-dev \
            liblzma-dev libmpv-dev ninja-build patchelf pkg-config

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        working-directory: flutter_app
        shell: bash
        run: |
          base="$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          echo "value=${base}-main.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        working-directory: flutter_app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: packaging/build-linux.sh appimage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchparty-linux
          path: flutter_app/build/dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        working-directory: flutter_app
        shell: bash
        run: |
          base="$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          echo "value=${base}-main.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare Flutter
        working-directory: flutter_app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

          $roots = @($env:PUB_CACHE, "$env:LOCALAPPDATA\Pub\Cache", "$env:APPDATA\Pub\Cache") |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'hosted\pub.dev')) }
          $flutterWebrtc = $null
          foreach ($root in $roots) {
            $candidate = Get-ChildItem (Join-Path $root 'hosted\pub.dev') -Directory -Filter 'flutter_webrtc-*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $flutterWebrtc = $candidate; break }
          }
          if (-not $flutterWebrtc) { throw 'flutter_webrtc not found in pub cache' }

          $version = $flutterWebrtc.Name -replace '^flutter_webrtc-',''
          $thirdParty = Join-Path $flutterWebrtc.FullName 'third_party'
          if (-not (Test-Path (Join-Path $thirdParty 'libwebrtc'))) {
            $downloads = Join-Path $thirdParty 'downloads'
            New-Item -ItemType Directory -Force -Path $downloads | Out-Null
            $archive = Join-Path $downloads 'libwebrtc.zip'
            Invoke-WebRequest -Uri "https://github.com/flutter-webrtc/flutter-webrtc/releases/download/v$version/libwebrtc.zip" -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $thirdParty -Force
          }

      - name: Build
        working-directory: flutter_app
        shell: pwsh
        run: flutter build windows --release --build-number="$env:GITHUB_RUN_NUMBER"

      - name: Package installer
        working-directory: flutter_app
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $system32 = Join-Path $env:SystemRoot 'System32'
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','msvcp140_1.dll') {
            Copy-Item (Join-Path $system32 $dll) $release -Force
          }

          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $output = (Resolve-Path dist).Path
          & $iscc "/DMyAppVersion=$env:VERSION" "/DMySourceDir=$release" "/DMyOutputDir=$output" "/DMyOutputBase=Watchparty-$env:VERSION-windows-setup" 'packaging/windows/watchparty.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchparty-windows
          path: flutter_app/dist/*.exe
          if-no-files-found: error

  publish-desktop:
    name: Publish desktop downloads
    needs: [changes, macos, linux, windows]
    if: needs.changes.outputs.desktop == 'true'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: desktop-builds
          merge-multiple: true

      - name: Write release metadata
        shell: bash
        run: |
          set -euo pipefail
          cd desktop-builds
          sha256sum * > SHA256SUMS
          base="$(awk '/^version:/{print $2; exit}' ../flutter_app/pubspec.yaml | cut -d+ -f1)"
          mac="$(printf '%s\n' *.dmg)"
          linux="$(printf '%s\n' *.AppImage)"
          windows="$(printf '%s\n' *.exe)"
          artifact() {
            jq -n --arg filename "$1" --argjson size "$(stat -c %s "$1")" \
              --arg sha256 "$(sha256sum "$1" | cut -d' ' -f1)" \
              '{filename:$filename,size:$size,sha256:$sha256}'
          }
          jq -n \
            --arg version "${base}-main.${GITHUB_RUN_NUMBER}" \
            --argjson build "$GITHUB_RUN_NUMBER" \
            --arg commit "$GITHUB_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson macos "$(artifact "$mac")" \
            --argjson linux "$(artifact "$linux")" \
            --argjson windows "$(artifact "$windows")" \
            '{version:$version,build:$build,commit:$commit,builtAt:$builtAt,artifacts:{macos:$macos,linux:$linux,windows:$windows}}' \
            > release.json

      - name: Upload builds to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: desktop-builds/*
          target: ${{ env.SERVER_BUILDS_PATH }}/incoming-${{ github.run_id }}
          strip_components: 1

      - name: Replace latest server builds
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            root="${{ env.SERVER_BUILDS_PATH }}"
            incoming="$root/incoming-${{ github.run_id }}"
            test -d "$incoming"
            rm -rf "$root/previous"
            if [ -d "$root/latest" ]; then cp -a "$root/latest" "$root/previous"; fi
            mkdir -p "$root/latest"
            find "$incoming" -maxdepth 1 -type f ! -name release.json -exec cp -a {} "$root/latest"/ \;
            cp "$incoming/release.json" "$root/latest/.release.json.new"
            mv "$root/latest/.release.json.new" "$root/latest/release.json"
            for existing in "$root/latest"/*; do
              [ -e "$existing" ] || continue
              name="$(basename "$existing")"
              if [ "$name" != release.json ] && [ ! -e "$incoming/$name" ]; then rm -f "$existing"; fi
            done
            rm -rf "$incoming"
            find "$root" -maxdepth 1 -type d -name 'incoming-*' -mtime +1 -exec rm -rf {} +
