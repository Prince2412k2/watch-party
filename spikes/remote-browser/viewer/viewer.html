<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>remote browser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               font: 13px/1.45 ui-monospace, SFMono-Regular, monospace; color: #eee; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  /* 1:1 — one remote pixel per screen pixel, so nothing is resampled. Anything
     larger than the viewport is centre-cropped rather than shrunk. */
  video.actual { object-fit: none; }
  /* Sits over the video and swallows every pointer event so the browser's own
     video controls never see them. touch-action:none stops the page panning and
     pinch-zooming on a phone, which would otherwise eat every drag. */
  #grab { position: fixed; inset: 0; touch-action: none; cursor: crosshair; outline: none; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 8px;
         align-items: center; padding: 6px 8px; background: rgba(12,12,14,.82);
         backdrop-filter: blur(6px); transition: opacity .2s; }
  #bar.hide { opacity: 0; pointer-events: none; }
  input, button { font: inherit; }
  #url { flex: 1; min-width: 0; background: #17161a; color: #eee; border: 1px solid #333;
         border-radius: 6px; padding: 6px 9px; }
  button { background: #26252b; color: #eee; border: 1px solid #3a3a42; border-radius: 6px;
           padding: 6px 10px; cursor: pointer; }
  button:hover { background: #32313a; }
  button.p { background: #c8322f; border-color: #c8322f; font-weight: 700; }
  #stats { position: fixed; right: 8px; bottom: 8px; z-index: 5; white-space: pre;
           background: rgba(12,12,14,.86); border: 1px solid #2a2a2a; border-radius: 8px;
           padding: 9px 11px; font-size: 11.5px; display: none; }
  #stats.on { display: block; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 6;
         text-align: center; color: #aaa; max-width: 80vw; white-space: pre-wrap; }
</style>

<div id="stage"><video id="v" autoplay playsinline></video></div>
<div id="grab" tabindex="0"></div>

<div id="bar">
  <button id="back" title="Back">←</button>
  <button id="fwd" title="Forward">→</button>
  <button id="reload" title="Reload">⟳</button>
  <input id="url" placeholder="type a URL and press Enter" spellcheck="false">
  <button id="tab" title="New tab">+</button>
  <button id="snd" title="Enable sound">🔇 Sound</button>
  <button id="fit" title="Toggle 1:1 / fit">fit</button>
  <button id="fs" class="p" title="Fullscreen">⛶ Fullscreen</button>
  <button id="st" title="Toggle stats">stats</button>
</div>

<div id="stats">connecting…</div>
<div id="msg">connecting…</div>

<script src="./livekit-client.umd.js"></script>
<script>
const LK = window.LivekitClient
const $ = id => document.getElementById(id)
const S = window.__SPIKE || {}
const q = new URLSearchParams(location.search)
const video = $('v'), grab = $('grab'), msg = $('msg')

// ---- input forwarding -------------------------------------------------------
// The server injects with xdotool and expects SCREEN coordinates, so all the
// letterbox correction happens here — it is the only side that knows the layout.
//
// Batched with exactly ONE request in flight, deliberately. Firing a fetch per
// pointermove (40/s) overruns Chrome's ~6-connections-per-origin limit as soon as
// the server falls behind, and the excess queues in the network stack without
// bound. The tab then goes "Page Unresponsive" and — the real tell — cannot even
// be reloaded, because a reload waits on in-flight requests.
const outbox = []
let inFlight = false
const MAX_QUEUE = 64

function post(ev) {
  // Only the newest cursor position matters; an old one is not worth a round trip.
  if (ev.type === 'move' && outbox.length && outbox[outbox.length - 1].type === 'move') {
    outbox[outbox.length - 1] = ev
  } else {
    outbox.push(ev)
  }
  // Never grow without bound. Drop the oldest MOVE rather than a click or a
  // keystroke, which are the events a user would actually notice losing.
  while (outbox.length > MAX_QUEUE) {
    const i = outbox.findIndex(e => e.type === 'move')
    outbox.splice(i === -1 ? 0 : i, 1)
  }
  flush()
}

function flush() {
  if (inFlight || !outbox.length) return
  const batch = outbox.splice(0, outbox.length)
  inFlight = true
  fetch('/input', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ events: batch }),
  }).catch(() => {}).finally(() => { inFlight = false; flush() })
}

let fitMode = 'contain'   // 'contain' | 'actual'

// Where the image actually sits on screen. object-fit centres the image inside the
// element and it is NOT the element's own size — assuming otherwise is what makes a
// remote cursor drift further off the further you move from the centre. Handles
// both fit modes so input stays correct when you toggle.
function geom() {
  const vw = video.videoWidth, vh = video.videoHeight
  if (!vw || !vh) return null
  const r = video.getBoundingClientRect()
  const scale = fitMode === 'actual' ? 1 : Math.min(r.width / vw, r.height / vh)
  const dw = vw * scale, dh = vh * scale
  return { vw, vh, scale, ox: r.left + (r.width - dw) / 2, oy: r.top + (r.height - dh) / 2 }
}

function toScreen(clientX, clientY) {
  const g = geom()
  if (!g) return null
  const x = (clientX - g.ox) / g.scale
  const y = (clientY - g.oy) / g.scale
  if (x < 0 || y < 0 || x > g.vw || y > g.vh) return null
  return { x: Math.round(x), y: Math.round(y) }
}

const BTN = { 0: 1, 1: 2, 2: 3 }   // DOM button -> X button
let lastMove = 0

grab.addEventListener('pointerdown', e => {
  grab.focus()
  grab.setPointerCapture(e.pointerId)
  const p = toScreen(e.clientX, e.clientY)
  if (p) post({ type: 'down', x: p.x, y: p.y, button: BTN[e.button] || 1 })
  e.preventDefault()
})
grab.addEventListener('pointerup', e => {
  const p = toScreen(e.clientX, e.clientY)
  if (p) post({ type: 'up', x: p.x, y: p.y, button: BTN[e.button] || 1 })
  e.preventDefault()
})
grab.addEventListener('pointermove', e => {
  // ~40/s. Unthrottled this floods the endpoint and xdotool becomes the
  // bottleneck, which reads as laggy input rather than as too many requests.
  const now = performance.now()
  if (now - lastMove < 25) return
  lastMove = now
  const p = toScreen(e.clientX, e.clientY)
  if (p) post({ type: 'move', x: p.x, y: p.y })
})
grab.addEventListener('contextmenu', e => e.preventDefault())
grab.addEventListener('wheel', e => {
  post({ type: 'scroll', dy: e.deltaY })
  e.preventDefault()
}, { passive: false })

const KEYMAP = {
  Backspace: 'BackSpace', Enter: 'Return', Tab: 'Tab', Escape: 'Escape',
  ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
  Delete: 'Delete', Home: 'Home', End: 'End', PageUp: 'Prior', PageDown: 'Next',
  ' ': 'space',
}
grab.addEventListener('keydown', e => {
  const mods = []
  if (e.ctrlKey) mods.push('ctrl')
  if (e.altKey) mods.push('alt')
  if (e.shiftKey && e.key.length > 1) mods.push('shift')
  const named = KEYMAP[e.key] || (/^F\d{1,2}$/.test(e.key) ? e.key : null)
  if (named) {
    post({ type: 'key', key: [...mods, named].join('+') })
  } else if (e.key.length === 1) {
    // A modifier means it is a shortcut (ctrl+l), not text to type.
    if (mods.length) post({ type: 'key', key: [...mods, e.key.toLowerCase()].join('+') })
    else post({ type: 'text', text: e.key })
  } else {
    return
  }
  e.preventDefault()
})

// ---- toolbar ----------------------------------------------------------------
$('back').onclick = () => post({ type: 'key', key: 'alt+Left' })
$('fwd').onclick = () => post({ type: 'key', key: 'alt+Right' })
$('reload').onclick = () => post({ type: 'key', key: 'F5' })
$('tab').onclick = () => post({ type: 'key', key: 'ctrl+t' })
$('st').onclick = () => $('stats').classList.toggle('on')
$('fit').onclick = () => {
  fitMode = fitMode === 'contain' ? 'actual' : 'contain'
  video.classList.toggle('actual', fitMode === 'actual')
  $('fit').textContent = fitMode === 'contain' ? 'fit' : '1:1'
  $('stats').classList.add('on')   // the scale line is the point of the toggle
}

let audioEl = null
function setSound(on) {
  const b = $('snd')
  b.textContent = on ? '🔊 Sound' : '🔇 Sound'
  b.classList.toggle('p', !on)      // highlight while it still needs a click
  b.title = on ? 'Audio playing' : 'Click to enable audio (browser needs a gesture)'
}
$('snd').onclick = async () => {
  if (!audioEl) { setSound(false); return }
  try { audioEl.muted = false; await audioEl.play(); setSound(true) }
  catch (e) { setSound(false) }
}
$('fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen()
  else document.documentElement.requestFullscreen().catch(() => {})
}
$('url').addEventListener('keydown', e => {
  e.stopPropagation()
  if (e.key !== 'Enter') return
  const u = $('url').value.trim()
  if (!u) return
  post({ type: 'key', key: 'ctrl+l' })
  setTimeout(() => post({ type: 'text', text: u }), 90)
  setTimeout(() => post({ type: 'key', key: 'Return' }), 220)
  $('url').blur(); grab.focus()
})

// Auto-hide the toolbar so it stops looking like a video player with chrome
// bolted on. Moving the pointer to the top brings it back.
let hideT
const bar = $('bar')
function nudgeBar(show) {
  bar.classList.toggle('hide', !show)
  clearTimeout(hideT)
  if (show) hideT = setTimeout(() => bar.classList.add('hide'), 2600)
}
addEventListener('pointermove', e => nudgeBar(e.clientY < 70))
nudgeBar(true)

// ---- connect ----------------------------------------------------------------
async function watch() {
  const url = q.get('lk') || S.lk || 'ws://localhost:7880'
  const token = q.get('token') || S.token
  if (!token) { msg.textContent = 'no token — is the container serving this page?'; return }

  const room = new LK.Room({ adaptiveStream: false, dynacast: false })
  room.on(LK.RoomEvent.TrackSubscribed, track => {
    if (track.kind === 'video') { track.attach(video); msg.style.display = 'none'; stats(room); grab.focus() }
    if (track.kind === 'audio') {
      audioEl = track.attach()
      audioEl.autoplay = true
      document.body.appendChild(audioEl)
      // This page auto-connects, so there is no user gesture yet and every
      // browser refuses to start audible playback. The promise rejecting is the
      // NORMAL path, not an error — surface a button instead of failing silently,
      // which is indistinguishable from "the stream has no audio".
      audioEl.play().then(() => setSound(true)).catch(() => setSound(false))
    }
  })
  room.on(LK.RoomEvent.Disconnected, () => { msg.style.display = ''; msg.textContent = 'disconnected' })
  await room.connect(url, token)
  msg.textContent = 'connected — waiting for the browser stream…'
}

function stats(room) {
  let prev = null
  setInterval(async () => {
    const pub = [...room.remoteParticipants.values()]
      .flatMap(p => [...p.videoTrackPublications.values()]).find(p => p.track)
    const r = pub && pub.track && pub.track.receiver
    if (!r) return
    let inb = null
    ;(await r.getStats()).forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s })
    if (!inb) return
    let kbps = 0
    if (prev && inb.timestamp > prev.timestamp) {
      kbps = Math.round(((inb.bytesReceived - prev.bytesReceived) * 8) / (inb.timestamp - prev.timestamp))
    }
    prev = inb
    // Display scale is the number that matters for how sharp this looks. Anything
    // other than 100% means every remote pixel is being resampled, which reads as
    // soft, oversized browser UI. The cure is matching the remote screen to this
    // viewport, not raising the bitrate.
    const g = geom()
    const pct = g ? Math.round(g.scale * 100) : 100
    const vp = `${Math.round(innerWidth)}x${Math.round(innerHeight)}`
    $('stats').textContent =
      `remote  ${inb.frameWidth || 0}x${inb.frameHeight || 0} @ ${Math.round(inb.framesPerSecond || 0)}fps\n`
      + `viewport ${vp}\n`
      + `scale   ${pct}%${pct === 100 ? '  (1:1, no resampling)' : '  <- resampled, looks soft'}\n`
      + `${kbps} kbps\n`
      + `decoder ${inb.decoderImplementation || '?'}\n`
      + `lost ${inb.packetsLost || 0}  freezes ${inb.freezeCount || 0}\n`
      + `jbuf ${((inb.jitterBufferDelay / (inb.jitterBufferEmittedCount || 1)) * 1000 || 0).toFixed(0)}ms`
  }, 1000)
}

watch().catch(e => { msg.textContent = 'FATAL\n' + (e && e.message ? e.message : e) })
</script>
