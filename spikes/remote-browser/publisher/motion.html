<!doctype html>
<meta charset="utf-8">
<title>spike motion control</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 8px; bottom: 6px; color: #0f0;
         font: 12px/1.3 ui-monospace, monospace; text-shadow: 0 0 3px #000; }
</style>
<canvas id="c"></canvas>
<div id="hud">…</div>
<script>
// Codec-independent control. If the video stage looks bad, this separates
// "capture/encode can't sustain the framerate" from "the page wasn't playing" —
// nothing here decodes anything, it just guarantees full-frame motion every frame.
const c = document.getElementById('c')
const hud = document.getElementById('hud')
c.width = 1280; c.height = 720
const g = c.getContext('2d', { alpha: false })

let frame = 0, last = performance.now(), lastFrame = 0
function draw() {
  const t = frame / 60
  // Deliberately high-entropy: a slow gradient would compress to nothing and
  // flatter the encoder.
  for (let i = 0; i < 48; i++) {
    const x = (Math.sin(t + i * 0.7) * 0.5 + 0.5) * c.width
    const y = (Math.cos(t * 1.3 + i * 1.1) * 0.5 + 0.5) * c.height
    g.fillStyle = `hsl(${(i * 24 + frame * 3) % 360} 90% 55%)`
    g.fillRect(x - 60, y - 60, 120, 120)
  }
  g.fillStyle = '#000'
  g.fillRect(0, 0, c.width, 26)
  g.fillStyle = '#fff'
  g.font = '18px monospace'
  g.fillText('frame ' + frame + '  t=' + t.toFixed(2) + 's', 10, 19)
  frame++
  requestAnimationFrame(draw)
}
requestAnimationFrame(draw)

setInterval(() => {
  const now = performance.now()
  const fps = ((frame - lastFrame) * 1000 / (now - last)).toFixed(1)
  last = now; lastFrame = frame
  hud.textContent = `rAF fps=${fps} frame=${frame}`
  console.log('STAGE ' + hud.textContent)
}, 2000)
</script>
