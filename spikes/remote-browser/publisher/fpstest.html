<!doctype html>
<meta charset="utf-8">
<title>fpstest</title>
<video id="v" autoplay muted playsinline style="width:320px"></video>
<script>
// Measures the rate getDisplayMedia actually delivers, independent of LiveKit and
// of any encoder. requestVideoFrameCallback fires once per presented frame, so
// this counts real delivered frames rather than what the constraints asked for.
const out = m => console.log('FPS ' + m)
const want = Number(new URLSearchParams(location.search).get('fps') || 30)
;(async () => {
  try {
    const q = new URLSearchParams(location.search)
    const video = { frameRate: { ideal: want, max: want } }
    // ?wh=1 reproduces the publisher's constraints, which also ask for a
    // resolution and so engage Chromium's crop-and-scale path.
    if (q.get('wh') === '1') {
      video.width = { ideal: 1280 }
      video.height = { ideal: 720 }
    }
    const s = await navigator.mediaDevices.getDisplayMedia({ video, audio: false })
    const t = s.getVideoTracks()[0]
    t.contentHint = 'motion'
    const v = document.getElementById('v')
    v.srcObject = s
    out('asked=' + want + ' settings=' + JSON.stringify(t.getSettings()))

    let n = 0, t0 = 0
    const tick = (now) => {
      if (!t0) t0 = now
      n++
      if (now - t0 >= 5000) {
        out('DELIVERED fps=' + (n * 1000 / (now - t0)).toFixed(1) + ' frames=' + n)
        t0 = now; n = 0
      }
      v.requestVideoFrameCallback(tick)
    }
    v.requestVideoFrameCallback(tick)
  } catch (e) {
    out('FAIL ' + e.name + ': ' + e.message)
  }
})()
</script>
