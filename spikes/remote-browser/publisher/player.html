<!doctype html>
<meta charset="utf-8">
<title>spike stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100vw; height: 100vh; object-fit: cover; display: block; }
  #hud { position: fixed; left: 8px; bottom: 6px; z-index: 2; color: #0f0;
         font: 12px/1.3 ui-monospace, monospace; text-shadow: 0 0 3px #000; }
</style>
<video id="v" autoplay loop playsinline></video>
<div id="hud">starting…</div>
<script>
// Loops so the stage keeps moving for the whole measurement run — a bare .mp4
// URL plays once and then freezes on a still frame, which silently turns a
// motion test into a static-image test.
const q = new URLSearchParams(location.search)
const v = document.getElementById('v')
const hud = document.getElementById('hud')
v.src = q.get('src') || 'https://media.w3.org/2010/05/sintel/trailer.mp4'
v.muted = q.get('muted') === '1'
v.play().catch(e => { hud.textContent = 'play() rejected: ' + e.name })

// Reports decoded-frame throughput, so a screenshot alone tells you whether the
// stage is genuinely animating and at what rate.
let last = performance.now(), lastFrames = 0
setInterval(() => {
  const q2 = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null
  const frames = q2 ? q2.totalVideoFrames : 0
  const now = performance.now()
  const fps = ((frames - lastFrames) * 1000 / (now - last)).toFixed(1)
  last = now; lastFrames = frames
  hud.textContent = `t=${v.currentTime.toFixed(1)}s decodedFps=${fps} `
    + `dropped=${q2 ? q2.droppedVideoFrames : '?'} ${v.videoWidth}x${v.videoHeight} `
    + `paused=${v.paused} muted=${v.muted}`
  console.log('STAGE ' + hud.textContent)
}, 2000)
</script>
