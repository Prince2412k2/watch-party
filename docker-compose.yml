# Unified watch-party deployment — SINGLE source of truth.
#
# All services share one bridge network (watchparty-net) so they resolve each
# other by container name (e.g. the app reaches http://jellyfin:8096,
# http://sonarr:8989, ws://livekit:7880). The app builds + serves the frontend
# and exposes /api + Socket.io on ONE host port (3000).
#
# Bring up:  docker compose up -d --build
#
# NOTE: docker-compose.servarr.yml is superseded by this file — the servarr
# services below are the canonical definitions. Do not run both compose files
# for the same services at once.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: watchparty-jellyfin
    restart: unless-stopped
    networks: [watchparty-net]
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./media:/media
      # Servarr-imported media (Radarr/Sonarr import into ${MEDIA_ROOT}/media/{movies,tv})
      # mounted read-only so Jellyfin can scan downloaded content — a "Shows"
      # library points at /servarr-media/tv and the Movies library also scans
      # /servarr-media/movies. This bridges the Jellyfin (./media) vs Servarr
      # (./media-data) tree split so grabbed titles appear in the library.
      - ${MEDIA_ROOT:-./media-data}/media:/servarr-media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096

  livekit:
    image: livekit/livekit-server:latest
    container_name: watchparty-livekit
    restart: unless-stopped
    networks: [watchparty-net]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      # DEV config, not the prod one. Differs only in rtc.use_external_ip: false —
      # see the header of that file for why, and how to regenerate it. Prod keeps
      # using secrets/livekit.yaml via docker-compose.prod.yml.
      - ./secrets/livekit.dev.yaml:/etc/livekit.yaml:ro
    environment:
      # Only set this if clients live off-box (tailnet/LAN) and need a specific
      # interface advertised. Left unset, use_external_ip: false makes LiveKit
      # advertise its own container address, which is what local browsers want.
      # NOTE: NODE_IP has no effect while use_external_ip is true — that path
      # overwrites the node IP from STUN at startup.
      - NODE_IP=${LIVEKIT_NODE_IP:-}
    command: --config /etc/livekit.yaml

  # coturn — uncomment for VPS deploy
  # coturn:
  #   image: coturn/coturn:latest
  #   container_name: watchparty-coturn
  #   network_mode: host
  #   volumes:
  #     - ./coturn.conf:/etc/coturn/turnserver.conf

  watchparty:
    build: ./app
    container_name: watchparty-app
    restart: unless-stopped
    networks: [watchparty-net]
    ports:
      # One port: built web UI + /api + Socket.io + /jellyfin + /livekit proxies.
      # Host 3000 was occupied by an unrelated process on this machine, so the
      # app is published on host 3001 -> container 3000. Change the left side to
      # "3000:3000" on a host where 3000 is free.
      - "3001:3000"
    volumes:
      # Persistent session store (file-based) so `--build` restarts don't log
      # everyone out — express-session's default MemoryStore is wiped on every
      # container recreate. See app/server/index.js's sessionStoreDir.
      - ./data/sessions:/data/sessions
      - ./data/subtitles:/data/subtitles
    env_file:
      # .env  = base (internal URLs, LiveKit keys, SESSION_SECRET)
      # .env.local = optional real secrets (servarr API keys, LiveKit keys).
      #   Both are pass-through only; the `environment:` block below overrides
      #   any service URLs so internal names always win inside the container.
      - .env
      - .env.local
    environment:
      # ── Server → service: INTERNAL container names (never sent to browser) ──
      - JELLYFIN_URL=http://jellyfin:8096
      - LIVEKIT_URL=ws://livekit:7880
      - SONARR_URL=http://sonarr:8989
      - RADARR_URL=http://radarr:7878
      - PROWLARR_URL=http://prowlarr:9696
      - BAZARR_URL=http://bazarr:6767
      - QBITTORRENT_URL=http://qbittorrent:8080
      # ── Browser → LiveKit: must be reachable from the user's machine. ───────
      # Default is the published host port; behind HTTPS set this (in .env) to
      # the app-origin signaling proxy, e.g. wss://<host>/livekit.
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      # Extra allowed CORS origin(s), comma-separated (dev + tailnet are built in).
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      # ── Shared browser (off unless BROWSER_ENABLED is set) ──────────────────
      # The agent is reached by container name on this network. An unreachable or
      # absent container reads as "the feature is unavailable", never as a fault,
      # so setting the flag without the container degrades safely.
      - BROWSER_ENABLED=${BROWSER_ENABLED:-}
      - BROWSER_AGENT_URL=http://watchparty-browser:8080
      - BROWSER_AGENT_TOKEN=${BROWSER_AGENT_TOKEN:-}
      - BROWSER_HOME_URL=${BROWSER_HOME_URL:-https://www.google.com}
      - BROWSER_MAX_BITRATE_KBPS=${BROWSER_MAX_BITRATE_KBPS:-2500}
      # The same two values the container gets below. The server sends them to
      # clients, which need them to translate a click into a remote coordinate —
      # so both sides must read one setting, not two.
      - BROWSER_SCREEN_W=${BROWSER_SCREEN_W:-1280}
      - BROWSER_SCREEN_H=${BROWSER_SCREEN_H:-720}
      # ── Serve config ──
      - SERVE_CLIENT=1
      - PORT=3000
    depends_on:
      jellyfin:
        condition: service_started
      livekit:
        condition: service_started
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      bazarr:
        condition: service_healthy
      qbittorrent:
        condition: service_started

  # ── Shared browser (opt-in) ────────────────────────────────────────────────
  # A containerised Chromium that publishes its own screen into a party's LiveKit
  # room. Two switches, both in .env, because they answer different questions:
  #
  #   BROWSER_ENABLED=1          does the app offer the feature?
  #   COMPOSE_PROFILES=browser   does this container exist at all?
  #
  # Either one alone is safe: the app treats an unreachable container as
  # "unavailable", and a container nobody talks to sits idle at near-zero CPU.
  # See docs/ops/shared-browser.md.
  browser:
    build: ./browser
    container_name: watchparty-browser
    restart: unless-stopped
    profiles: [browser]
    init: true
    networks: [watchparty-net]
    # No `ports:` on purpose. The control API accepts input injection and must be
    # reachable only from app/server on this network — publishing it would put a
    # remote-keyboard endpoint on the host's interfaces.
    #
    # Chromium wants real shared memory; on the default 64m it either crashes or
    # falls back to disk and the framerate collapses. Note that under cgroup v2
    # these pages count against mem_limit below.
    shm_size: "1gb"
    tmpfs:
      # Chromium profiles: cookies, history, downloads, extensions. On a tmpfs so
      # a wipe that fails, or a container killed outright, still cannot leak a
      # signed-in session into the next party.
      - /profiles:size=512m,mode=1777
    volumes:
      # Optional corporate TLS-inspection CA. Empty is the normal case; only a
      # developer behind an HTTPS-intercepting appliance needs this.
      - ./browser/extra-ca:/opt/browser/extra-ca:ro
    environment:
      # Interpolated with :- not :? — a `:?` guard here fails every compose
      # command in the repo, even ones that do not select this profile.
      # entrypoint.sh refuses to start without it instead.
      - BROWSER_AGENT_TOKEN=${BROWSER_AGENT_TOKEN:-}
      - SCREEN_W=${BROWSER_SCREEN_W:-1280}
      - SCREEN_H=${BROWSER_SCREEN_H:-720}
      - SCREEN_FPS=${BROWSER_FPS:-30}
      - MAX_BITRATE_KBPS=${BROWSER_MAX_BITRATE_KBPS:-2500}
    # Measured, not guessed: 720p30 of YouTube cost 68.6% of one core (peaks to
    # ~160%) and 1.15 GiB. 4 vCPUs of the prod box's 8 covers the peaks; 3 GiB is
    # ~2.6x the measured peak, and prod has NO SWAP, so an over-tight limit is an
    # OOM kill rather than a slowdown. See the spike decision record.
    cpus: "4.0"
    mem_limit: 3g
    depends_on:
      livekit:
        condition: service_started

  # ── Media-acquisition stack (Servarr + qBittorrent) ────────────────────────
  # All on watchparty-net so the app reaches them by name and they reach each
  # other (Prowlarr -> Sonarr, Sonarr -> qBittorrent). Config + media bind
  # mounts are preserved from the previous docker-compose.servarr.yml layout.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: watchparty-prowlarr
    restart: unless-stopped
    networks: [watchparty-net]
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./servarr-config}/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: watchparty-sonarr
    restart: unless-stopped
    networks: [watchparty-net]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./servarr-config}/sonarr:/config
      - ${MEDIA_ROOT:-./media-data}:/data
    ports:
      - "${SONARR_PORT:-8989}:8989"
    depends_on:
      - prowlarr
      - qbittorrent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: watchparty-radarr
    restart: unless-stopped
    networks: [watchparty-net]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./servarr-config}/radarr:/config
      - ${MEDIA_ROOT:-./media-data}:/data
    ports:
      - "${RADARR_PORT:-7878}:7878"
    depends_on:
      - prowlarr
      - qbittorrent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: watchparty-bazarr
    restart: unless-stopped
    networks: [watchparty-net]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./servarr-config}/bazarr:/config
      - ${MEDIA_ROOT:-./media-data}:/data
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    depends_on:
      - sonarr
      - radarr
    healthcheck:
      # /api/system/status requires an API key (401 without one), which
      # falsely marked this container "unhealthy" forever and blocked any
      # service with `depends_on: condition: service_healthy` on it. Root `/`
      # needs no auth and returns 200 once Bazarr is actually up.
      test: ["CMD", "curl", "-fsS", "http://localhost:6767/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: watchparty-qbittorrent
    restart: unless-stopped
    networks: [watchparty-net]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=${QBITTORRENT_PORT:-8080}
    volumes:
      - ${CONFIG_ROOT:-./servarr-config}/qbittorrent:/config
      - ${MEDIA_ROOT:-./media-data}:/data
    ports:
      - "${QBITTORRENT_PORT:-8080}:${QBITTORRENT_PORT:-8080}"
      - "${QBITTORRENT_BT_PORT:-6881}:6881"
      - "${QBITTORRENT_BT_PORT:-6881}:6881/udp"

networks:
  # Single shared network — every service resolves the others by container name.
  watchparty-net:
    name: watchparty-net
    driver: bridge
